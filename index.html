<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engineering Portfolio</title>

  <!-- Link external stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>Engineering Portfolio</h1>
      <p>Research Projects & Presentations</p>
    </header>

    <div class="projects-grid">
      
      <!-- PDF Project Card -->
      <article class="project-card">
        <div class="pdf-container">
          <object data="assets/pdfs/research-poster.pdf" type="application/pdf">
            <p>Your browser doesn't support PDF previews. 
               <a href="assets/pdfs/research-poster.pdf" target="_blank">Download PDF Report</a>
            </p>
          </object>
        </div>
        <div class="project-content">
          <h2 class="project-title">Design Optimization Research Poster</h2>
          <div class="card-actions">
            <a href="assets/pdfs/research-poster.pdf" class="btn btn-secondary" target="_blank">Download PDF</a>
          </div>
        </div>
      </article>

      <!-- Video Presentation Card -->
      <article class="project-card">
        <div class="video-container">
          <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID" allowfullscreen></iframe>
        </div>
        <div class="project-content">
          <h2 class="project-title">Senior Design Presentation</h2>
        </div>
      </article>

    </div>
  </div>

</body>
</html>
